# Whole platform on one machine with synthetic data:
#   docker compose up --build
# pipeline runs every step once (about 6 minutes), then the API serves plans on :8000,
# Prometheus scrapes it on :9090 and Grafana shows the dashboard on :3000 (admin/admin).
name: flash-sale-assortment

services:
  pipeline:
    build: { context: ., target: local }
    command: ["bash", "scripts/run_pipeline.sh"]
    environment:
      FSAP_DATA_ROOT: /data
    volumes: [fsap-data:/data]

  api:
    build: { context: ., target: runtime }
    depends_on:
      pipeline: { condition: service_completed_successfully }
    environment:
      FSAP_DATA_ROOT: /data
    volumes: [fsap-data:/data]
    ports: ["8000:8000"]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  fsap-data:
