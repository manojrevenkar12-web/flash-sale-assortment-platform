# fsap-api reads plans and models; fsap-batch (Airflow's pods) also writes them.
# Both get AWS access through IRSA roles created in deploy/terraform.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fsap-api
  annotations: {eks.amazonaws.com/role-arn: REPLACED_BY_OVERLAY}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fsap-batch
  annotations: {eks.amazonaws.com/role-arn: REPLACED_BY_OVERLAY}
